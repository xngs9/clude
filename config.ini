; clude 配置
[miao]

; sandbox = 只在 sandbox_dir 里随机删（安全，默认）
; danger  = 在 danger_roots 里随机删（真·乱删，需输确认词）
mode = sandbox

; 沙箱模式的作用域（相对本目录）
sandbox_dir = ./sandbox

; danger 模式允许随机删的目录，逗号分隔。
; 留空 = 谁都不放行；想用 danger 才填，比如： danger_roots = D:\temp
danger_roots =

; 保护名单：这些目录永不参与随机删（就算在 danger_roots 里面也照样跳过）
protect_roots =

; 创建文件固定落在这里（默认桌面）
create_dir = %USERPROFILE%\Desktop

; 大脑判定的最低置信度；低于它、或判成 other，就只「喵？」一声不动手
min_confidence = 0.55

; 叫几声（随机区间）
meow_min = 1
meow_max = 5

; true 时把「脑内判定 / 悄悄删了啥」打到 stderr（排查用）。默认 false = 真的只喵。
debug = false
